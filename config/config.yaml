# Config for the DRAGEN germline WGS + Nirvana + MultiQC Snakemake workflow.

# Tool / reference versions (provenance record). The `versions` rule also
# writes the live-detected values to <outdir>/versions.yaml at run time.
dragen_version: "4.4.7"
ica_version: "3.26.0"          # Illumina Connected Annotations (Nirvana)
hashtable_version: "11"        # hg38 pangenome reference

# Analysis mode (REQUIRED, no default): "germline" or "tumor_only".
# Left empty on purpose so every run is an explicit choice; the workflow
# refuses to start otherwise. Override per run: --config mode=tumor_only
#   germline   -> rule dragen (pangenome) + Nirvana + pipeline report (+ panel)
#   tumor_only -> rule dragen_somatic (linear hashtable, DRAGEN tumor-only recipe)
mode: ""

# Sample sheet: CSV with `sample,R1,R2` lines (# comments ignored).
# Regenerate with: pixi run samples
# Sample names come from metadata_csv (matched on the i7-i5 barcode pair in
# the FASTQ filename).
samples_csv: "data/samples.csv"
metadata_csv: "metadata/metadata.csv"

# Base output directory (one subdirectory per sample is created).
outdir: "output"

# DRAGEN binary and reference (hg38 pangenome, hashtable v11).
dragen_bin: "/opt/dragen/4.4.7/bin/dragen"
reference: "/staging/human/reference/hg38/pangenome_reference"
rgid: "Illumina_RGID"

# Germline WGS callers (each adds flags to the single DRAGEN run per sample).
enable_cnv: true       # --enable-cnv + --cnv-enable-self-normalization
enable_sv: true        # --enable-sv (Manta-based SV caller)
enable_repeats: true   # --repeat-genotype-enable (ExpansionHunter, default catalog)
enable_pgx: true       # --enable-targeted + --enable-star-allele + --enable-pgx
emit_gvcf: true        # --vc-emit-ref-confidence GVCF (keeps joint genotyping open)

# ---- mode: tumor_only. DRAGEN somatic tumor-only WGS (recipe: "DNA Somatic Tumor-Only Solid WGS") ----
# Organoids have no matched normal, so somatic calls come from tumor-only mode.
# Re-maps from FASTQ on the LINEAR hashtable (DRAGEN recommends linear for
# somatic; the germline BAMs above are pangenome-aligned). Outputs land in
# <somatic_outdir>/<sample>/ and do not collide with the germline run.
somatic_outdir: "output/somatic"
somatic_reference: "/staging/human/reference/hg38/hg38_hash_table_v11"
vc_target_vaf: 0.03            # recipe default (>= 3% VAF)
# Nirvana data dir (Cache/ References/ SupplementaryAnnotation/) used by DRAGEN
# for germline tagging (gnomAD/1000G population filter) and TMB.
variant_annotation_data: "/staging/human/reference/hg38/annotation_data_files"
enable_somatic_sv: true
enable_somatic_cnv: true       # self-normalized; add pop BAF VCF below for tumor-only BAF
enable_hrd: true               # requires somatic CNV
enable_tmb: true               # + --tmb-enable-proxi-filter (recommended for tumor-only)
# Resources from Illumina DRAGEN product files (not shipped in /opt/dragen).
# Empty string = flag omitted. vc_systematic_noise is REQUIRED by the recipe;
# the dragen_somatic rule refuses to run without it.
vc_systematic_noise: ""        # WGS SNV systematic-noise BED (hg38)
sv_systematic_noise: ""        # WGS SV systematic-noise BEDPE (hg38), recommended
cnv_population_baf_vcf: ""     # population SNP VCF for tumor-only CNV BAF
msi_microsatellites_file: ""   # MSI sites list; MSI runs only when this is set
msi_ref_normal: ""             # MSI reference-normal PON (--msi-ref-normal-input)
msi_coverage_threshold: 40

# Gene-panel variant extraction (any curated gene list). When true,
# symbols in <panel_csv> col1 (gene_symbol) are looked up in gene_gtf -> BED,
# each sample's annotated VCF is subset to those genes, merged into a
# multi-sample VCF, site-annotated once with Nirvana (JSON), and loaded into a
# queryable SQLite DB + .xlsx + PDF report under results/<panel_name>_*.
# panel_csv: CSV with a header row; gene_symbol must be column 1 (only
#   required column). Optional columns (any order after it, missing = empty): ensembl_gene_id, category, priority,
#   mechanism, key_variants (rsIDs here drive is_key_variant), evidence_note,
#   exome_capture_note (free-text coverage/recoverability caveat).
# To switch panels: point panel_csv at the new CSV, change panel_name and
# panel_description. Outputs for different panel_name values do not collide.
enable_panel: false
panel_csv: "data/pain_gene_panel_from_zeev_kain.csv"
panel_name: "pain"          # basename for results/<panel_name>_*; shown in reports
# One paragraph (Markdown ok) describing the panel's origin and scope; printed
# in the panel PDF report and the xlsx README sheet.
panel_description: >-
  A-priori pain / analgesia candidate-gene list curated by Zeev Kain (copied
  from the KainZ exome project): opioid pharmacokinetics / pharmacodynamics,
  pain sensitivity and nociception, chronic postsurgical pain,
  neuroinflammation and reward-axis genes.
panel_gene_padding: 0       # bases added each side of each gene interval
# GENCODE v47 GTF (GRCh38, chr-prefixed contigs; matches the VCF naming).
gene_gtf: "/staging/human/reference/hg38/gencode/gencode.v47.primary_assembly.annotation.gtf.gz"

# Adapter + quality trimming.
trim_adapter_r1: "/staging/human/Trimmomatic-0.39/adapters/TruSeq3-PE-2.fa"
trim_adapter_r2: "/staging/human/Trimmomatic-0.39/adapters/TruSeq3-PE-2.fa"
trim_min_quality: 15
trim_min_length: 20

# Variant-caller hard filter. Empty = no --vc-hard-filter passed (DRAGEN default
# filters still apply).
# Example:
#   "SNP filter:snp:QD < 2.0 || FS > 60.0 || MQ < 40.0 || MQRankSum < -12.5 || ReadPosRankSum < -8.0; INDEL filter:indel:QD < 2.0 || FS > 200.0 || ReadPosRankSum < -20.0"
vc_filter: ""

# Nirvana annotation (GRCh38). Cache dir is the parent Cache/ (holds the
# ICA-3.26 GeneModels transcript cache: GRCh38.Ensembl.ndb / GRCh38.RefSeq.ndb
# / GeneSymbols.ndb), NOT the legacy Cache/GRCh38/ (old Both.transcripts.ndb,
# silently rejected by 3.26). SD points at GRCh38_ica326: newest-only symlinks
# per source (no duplicate-key collisions from the mixed old/new SA dir).
nirvana_bin:   "/opt/dragen/4.4.7/share/nirvana/Nirvana"
nirvana_cache: "/staging/human/reference/hg38/annotation_data_files/Cache"
nirvana_dat:   "/staging/human/reference/hg38/annotation_data_files/References/Homo_sapiens.GRCh38.Nirvana.dat"
nirvana_sd:    "/staging/human/reference/hg38/annotation_data_files/SupplementaryAnnotation/GRCh38_ica326"
# Nirvana output format: json or vcf. json and vcf are mutually exclusive per run.
nirvana_output_format: "vcf"
